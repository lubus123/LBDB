<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flight Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L18.5 14 L30 18 L30 21 L18.5 19 L18.5 26 L22 28 L22 30 L16 28.5 L10 30 L10 28 L13.5 26 L13.5 19 L2 21 L2 18 L13.5 14 Z' fill='%23f5d300'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --bg: #0e0e0e;
    --panel: #161616;
    --border: #2a2a2a;
    --text: #eaeaea;
    --muted: #8a8a8a;
    --accent: #f5d300;
    --live: #4caf50;
    --idle: #cf6f4c;
    --error: #e25555;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  h1 {
    margin: 0; font-size: 17px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  h1 .plane { font-size: 20px; }
  h1 .code { color: var(--accent); letter-spacing: 0.5px; }
  .meta { display: flex; gap: 14px; font-size: 12px; flex-wrap: wrap; }
  .meta > div { display: flex; gap: 6px; }
  .meta .label { color: var(--muted); text-transform: uppercase; font-size: 10px; align-self: center; }
  .meta .value { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .status {
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .status::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor;
  }
  .status.live { background: rgba(76, 175, 80, 0.15); color: var(--live); }
  .status.idle { background: rgba(207, 111, 76, 0.15); color: var(--idle); }
  .status.error { background: rgba(226, 85, 85, 0.15); color: var(--error); }
  .status.live::before { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .spacer { flex: 1; }
  .controls { display: flex; gap: 6px; align-items: center; }
  input {
    background: #222; color: var(--text); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 4px; font-size: 13px; width: 110px;
    outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #1a1a1a; border: none;
    padding: 6px 12px; border-radius: 4px; cursor: pointer;
    font-size: 13px; font-weight: 600;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: #2a2a2a; color: var(--text); }
  button.secondary:hover { background: #3a3a3a; filter: none; }
  #map { height: 100%; background: #1a1a1a; }
  .leaflet-tile-pane {
    filter: brightness(0.6) contrast(1.1) hue-rotate(180deg) invert(0.9);
  }
  .leaflet-container { background: #0a0a0a; }
  .leaflet-control-attribution {
    background: rgba(0,0,0,0.6) !important; color: #888 !important;
  }
  .leaflet-control-attribution a { color: #aaa !important; }
  .plane-icon { background: transparent; border: none; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,20,0.95); color: var(--text);
    padding: 10px 18px; border-radius: 6px; border: 1px solid var(--border);
    font-size: 13px; z-index: 1000; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 600px) {
    header { padding: 8px 10px; gap: 8px; }
    h1 { font-size: 15px; }
    .meta { font-size: 11px; gap: 10px; }
    input { width: 90px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="plane">&#9992;&#65039;</span> <span class="code" id="callsign">BA910</span></h1>
    <span class="status idle" id="status">Loading&hellip;</span>
    <div class="meta">
      <div><span class="label">Alt</span> <span class="value" id="alt">&mdash;</span></div>
      <div><span class="label">Spd</span> <span class="value" id="spd">&mdash;</span></div>
      <div><span class="label">Hdg</span> <span class="value" id="hdg">&mdash;</span></div>
      <div><span class="label">Pos</span> <span class="value" id="pos">&mdash;</span></div>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <input id="flight-input" placeholder="BA910" maxlength="8" />
      <button onclick="setFlight()">Track</button>
      <button class="secondary" onclick="share()">Share</button>
    </div>
  </header>
  <div id="map"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// IATA -> ICAO airline code mapping for converting common flight numbers
// (e.g. BA910 -> BAW910) since OpenSky reports ICAO callsigns.
const IATA_TO_ICAO = {
  BA: 'BAW', AA: 'AAL', UA: 'UAL', DL: 'DAL', LH: 'DLH',
  AF: 'AFR', KL: 'KLM', EK: 'UAE', QR: 'QTR', SQ: 'SIA',
  CX: 'CPA', JL: 'JAL', NH: 'ANA', AC: 'ACA', QF: 'QFA',
  EI: 'EIN', VS: 'VIR', U2: 'EZY', FR: 'RYR', WN: 'SWA',
  AS: 'ASA', B6: 'JBU', NK: 'NKS', F9: 'FFT', WS: 'WJA',
  TK: 'THY', LX: 'SWR', OS: 'AUA', SN: 'BEL', IB: 'IBE',
  AY: 'FIN', LO: 'LOT', SK: 'SAS', AZ: 'ITY', TP: 'TAP',
  EY: 'ETD', SU: 'AFL', CA: 'CCA', MU: 'CES', CZ: 'CSN',
  KE: 'KAL', OZ: 'AAR', TG: 'THA', VN: 'HVN', GA: 'GIA',
  MH: 'MAS', PR: 'PAL', NZ: 'ANZ', LA: 'LAN', AV: 'AVA',
  CM: 'CMP', AM: 'AMX', AR: 'ARG', G3: 'GLO', JJ: 'TAM',
  SV: 'SVA', MS: 'MSR', ET: 'ETH', SA: 'SAA', AT: 'RAM',
  AI: 'AIC', 6E: 'IGO', UK: 'VTI', SG: 'SEJ', GF: 'GFA',
  WY: 'OMA', RJ: 'RJA', PK: 'PIA', UL: 'ALK'
};

const POLL_INTERVAL_MS = 15000;
const TRAIL_MAX = 300;

let map, marker, pathLine;
let currentFlight = 'BA910';
let pollTimer = null;
const trail = [];

function flightToCallsign(flight) {
  const f = flight.toUpperCase().trim();
  const m = f.match(/^([A-Z0-9]{2,3})(\d+[A-Z]?)$/);
  if (!m) return f;
  const code = m[1], num = m[2];
  const icao = IATA_TO_ICAO[code] || code;
  return icao + num;
}

function planeIcon(heading) {
  const h = (heading == null) ? 0 : heading;
  // top-down plane silhouette pointing up at 0deg, rotated to heading
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="40" height="40" '
    + 'style="transform: rotate(' + h + 'deg); transform-origin: 50% 50%; '
    + 'filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8));">'
    + '<path d="M16 2 L18.5 14 L30 18 L30 21 L18.5 19 L18.5 26 L22 28 L22 30 L16 28.5 L10 30 L10 28 L13.5 26 L13.5 19 L2 21 L2 18 L13.5 14 Z" '
    + 'fill="#f5d300" stroke="#1a1a1a" stroke-width="0.8" stroke-linejoin="round"/>'
    + '</svg>';
  return L.divIcon({
    html: svg,
    className: 'plane-icon',
    iconSize: [40, 40],
    iconAnchor: [20, 20]
  });
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status ' + cls;
}

function setMeta(state) {
  const lat = state[6], lon = state[5], alt = state[7], onGround = state[8],
        vel = state[9], hdg = state[10];
  document.getElementById('alt').textContent =
    onGround ? 'GROUND' : (alt != null ? Math.round(alt * 3.2808) + ' ft' : '—');
  document.getElementById('spd').textContent =
    vel != null ? Math.round(vel * 1.9438) + ' kt' : '—';
  document.getElementById('hdg').textContent =
    hdg != null ? Math.round(hdg) + '°' : '—';
  document.getElementById('pos').textContent =
    (lat != null && lon != null) ? lat.toFixed(3) + ', ' + lon.toFixed(3) : '—';
}

function clearMeta() {
  ['alt', 'spd', 'hdg', 'pos'].forEach(function(id) {
    document.getElementById(id).textContent = '—';
  });
}

function updatePlane(state) {
  const lon = state[5], lat = state[6], hdg = state[10];
  if (lat == null || lon == null) return;
  const pos = [lat, lon];
  if (!marker) {
    marker = L.marker(pos, { icon: planeIcon(hdg) }).addTo(map);
    map.setView(pos, 6, { animate: true });
  } else {
    marker.setLatLng(pos);
    marker.setIcon(planeIcon(hdg));
  }
  // append to trail if moved
  const last = trail[trail.length - 1];
  if (!last || last[0] !== lat || last[1] !== lon) {
    trail.push(pos);
    if (trail.length > TRAIL_MAX) trail.shift();
  }
  if (pathLine) map.removeLayer(pathLine);
  if (trail.length > 1) {
    pathLine = L.polyline(trail, {
      color: '#f5d300', weight: 2.5, opacity: 0.55, smoothFactor: 1.5
    }).addTo(map);
  }
  setMeta(state);
}

async function fetchFlight() {
  const callsign = flightToCallsign(currentFlight);
  try {
    const r = await fetch('https://opensky-network.org/api/states/all');
    if (r.status === 429) {
      setStatus('Rate limited — retrying', 'error');
      return;
    }
    if (!r.ok) throw new Error('API ' + r.status);
    const data = await r.json();
    const states = data.states || [];
    const state = states.find(function(s) {
      return s[1] && s[1].trim() === callsign;
    });
    if (!state) {
      setStatus('Not airborne · ' + new Date().toLocaleTimeString(), 'idle');
      clearMeta();
      return;
    }
    updatePlane(state);
    setStatus('Live · ' + new Date().toLocaleTimeString(), 'live');
  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  }
}

function setFlight() {
  const v = document.getElementById('flight-input').value.trim().toUpperCase();
  if (!v) return;
  currentFlight = v;
  document.getElementById('callsign').textContent = v;
  trail.length = 0;
  if (marker) { map.removeLayer(marker); marker = null; }
  if (pathLine) { map.removeLayer(pathLine); pathLine = null; }
  clearMeta();
  setStatus('Loading…', 'idle');
  const url = new URL(window.location.href);
  url.searchParams.set('flight', v);
  window.history.replaceState({}, '', url.toString());
  fetchFlight();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 1800);
}

async function share() {
  const url = window.location.href;
  const title = 'Tracking ' + currentFlight;
  try {
    if (navigator.share) {
      await navigator.share({ title: title, text: title, url: url });
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(url);
      toast('Link copied to clipboard');
    } else {
      window.prompt('Copy this link:', url);
    }
  } catch (e) { /* user cancelled */ }
}

function init() {
  const params = new URLSearchParams(window.location.search);
  currentFlight = (params.get('flight') || 'BA910').toUpperCase();
  document.getElementById('callsign').textContent = currentFlight;
  document.getElementById('flight-input').value = currentFlight;
  document.title = currentFlight + ' · Flight Tracker';

  map = L.map('map', {
    zoomControl: true,
    worldCopyJump: true
  }).setView([51.47, -0.45], 5); // default near LHR

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap · Data: OpenSky Network',
    maxZoom: 12,
    minZoom: 2
  }).addTo(map);

  document.getElementById('flight-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') setFlight();
  });

  fetchFlight();
  pollTimer = setInterval(fetchFlight, POLL_INTERVAL_MS);

  // pause polling when tab hidden, resume on return
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    } else if (!pollTimer) {
      fetchFlight();
      pollTimer = setInterval(fetchFlight, POLL_INTERVAL_MS);
    }
  });
}

window.addEventListener('load', init);
</script>
</body>
</html>
