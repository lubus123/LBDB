name: Deploy trip dashboard to gh-pages

# GitHub Pages for this repo is served from the gh-pages branch, so this
# workflow copies docs/japan-2026 into that branch on every push to main.
# Pages then rebuilds on its own from the branch push.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Sync docs/japan-2026 into gh-pages
        run: |
          rm -rf site/japan-2026
          cp -r docs/japan-2026 site/japan-2026
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already up to date"
            exit 0
          fi
          git commit -m "Deploy trip dashboard from ${GITHUB_SHA::7}"
          git push origin gh-pages
