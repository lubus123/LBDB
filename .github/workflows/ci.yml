name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: duckgammon
          POSTGRES_PASSWORD: duck123
          POSTGRES_DB: duckgammon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duckgammon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_TEST: postgresql://duckgammon:duck123@localhost:5432/duckgammon_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test
